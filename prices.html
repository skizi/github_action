<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メガドライブ 価格トラッカー</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --mercari: #ff4f4f;
      --yahoo: #ff0033;
      --paypay: #ff5a00;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    /* Nav */
    .nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .nav a:hover { color: var(--text); border-color: var(--border); }
    .nav a.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(88,166,255,0.08);
    }

    /* Page header */
    .page-header { margin-bottom: 1.75rem; }
    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; }
    .page-subtitle { color: var(--muted); font-size: 0.875rem; }

    /* Game section */
    .game-section {
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .game-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .game-title {
      font-size: 1.05rem;
      font-weight: 700;
      flex: 1;
      min-width: 200px;
    }
    .game-query {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: monospace;
    }
    .overall-min {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .overall-min strong {
      color: var(--green);
      font-size: 1rem;
    }

    /* Sites grid */
    .sites-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface2);
    }
    @media (max-width: 700px) {
      .sites-grid { grid-template-columns: 1fr; }
    }

    .site-col {
      padding: 1rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .site-col:last-child { border-right: none; }
    @media (max-width: 700px) {
      .site-col { border-right: none; border-bottom: 1px solid var(--border); }
      .site-col:last-child { border-bottom: none; }
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .site-name {
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .site-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-mercari  { background: var(--mercari); }
    .dot-yahoo    { background: var(--yahoo); }
    .dot-paypay   { background: var(--paypay); }

    .site-min {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
    }
    .site-count {
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* Listing table */
    .listing-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
    .listing-item a {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--text);
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.15s;
      font-size: 0.8rem;
    }
    .listing-item a:hover {
      background: rgba(88,166,255,0.06);
      border-color: var(--border);
      color: var(--accent);
    }
    .listing-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .listing-price {
      font-weight: 700;
      white-space: nowrap;
      color: var(--accent);
      font-size: 0.85rem;
    }
    .listing-price.cheapest { color: var(--green); }

    .no-data {
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.5rem 0;
      text-align: center;
    }

    /* Footer */
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }

    .loading { text-align: center; padding: 4rem; color: var(--muted); }
    .error   { text-align: center; padding: 2rem; color: var(--red); }
  </style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="index.html">プロフィール</a>
    <a href="prices.html" class="active">価格トラッカー</a>
  </nav>

  <div id="app" class="loading">読み込み中...</div>
</div>

<script>
  const SITES = [
    { key: "mercari",          label: "メルカリ",      dotClass: "dot-mercari"  },
    { key: "yahoo_auction",    label: "ヤフオク",      dotClass: "dot-yahoo"    },
    { key: "yahoo_freemarket", label: "Yahoo!フリマ",  dotClass: "dot-paypay"   },
  ];

  const ITEM_ORDER = ["outrun", "keio", "gaiares", "gods"];

  function fmt(yen) {
    return yen != null ? `¥${yen.toLocaleString()}` : "—";
  }

  function overallMin(gameData) {
    const prices = SITES
      .map(s => gameData[s.key]?.min_price)
      .filter(p => p != null);
    return prices.length ? Math.min(...prices) : null;
  }

  function renderSite(siteData, site) {
    const listings = siteData?.listings ?? [];
    const minP     = siteData?.min_price ?? null;
    const count    = siteData?.count ?? 0;

    const rows = listings.slice(0, 8).map((l, i) => {
      const isCheapest = i === 0 && minP != null;
      return `<li class="listing-item">
        <a href="${l.url}" target="_blank" rel="noopener noreferrer">
          <span class="listing-title">${escHtml(l.title)}</span>
          <span class="listing-price${isCheapest ? " cheapest" : ""}">
            ${fmt(l.price)}
          </span>
        </a>
      </li>`;
    }).join("");

    return `
      <div class="site-col">
        <div class="site-header">
          <div class="site-name">
            <span class="site-dot ${site.dotClass}"></span>
            ${site.label}
          </div>
          <span class="site-count">${count}件</span>
        </div>
        ${minP != null ? `<div class="site-min">最安 ${fmt(minP)}</div>` : ""}
        ${listings.length
          ? `<ul class="listing-list">${rows}</ul>`
          : `<p class="no-data">出品なし</p>`}
      </div>`;
  }

  function renderGame(id, gameData) {
    const oMin = overallMin(gameData);
    const siteCols = SITES.map(s => renderSite(gameData[s.key], s)).join("");

    return `
      <div class="game-section">
        <div class="game-header">
          <div class="game-title">メガドライブ ${escHtml(gameData.name)}</div>
          <span class="game-query">${escHtml(gameData.query)}</span>
          ${oMin != null
            ? `<div class="overall-min">3サイト最安値 <strong>${fmt(oMin)}</strong></div>`
            : ""}
        </div>
        <div class="sites-grid">${siteCols}</div>
      </div>`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function render() {
    const app = document.getElementById("app");
    try {
      const res = await fetch("data/prices.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const d = await res.json();

      const updated = d.updated_at
        ? new Date(d.updated_at).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" })
        : "—";

      const sections = ITEM_ORDER
        .filter(id => d.items?.[id])
        .map(id => renderGame(id, d.items[id]))
        .join("");

      app.className = "";
      app.innerHTML = `
        <div class="page-header">
          <div class="page-title">メガドライブ 価格トラッカー</div>
          <div class="page-subtitle">
            メルカリ・ヤフオク・Yahoo!フリマの最安値をまとめて確認
          </div>
        </div>
        ${sections || '<p class="no-data">データなし</p>'}
        <div class="footer">
          最終更新: ${updated}（JST）— GitHub Actions により毎日 09:00 自動更新
        </div>`;
    } catch (e) {
      app.innerHTML = `<div class="error">データ読み込みエラー: ${e.message}<br>
        <small style="color:var(--muted)">まだ初回実行前の可能性があります。Actions から手動実行してください。</small>
      </div>`;
    }
  }

  render();
</script>
</body>
</html>
