name: Update Profile Data

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 UTC 0:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub profile data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'skizi';

            const { data: user } = await github.rest.users.getByUsername({ username });

            const { data: repos } = await github.rest.repos.listForUser({
              username,
              sort: 'updated',
              per_page: 6,
              type: 'public',
            });

            const profile = {
              login:        user.login,
              name:         user.name,
              bio:          user.bio,
              avatar_url:   user.avatar_url,
              location:     user.location,
              blog:         user.blog,
              html_url:     user.html_url,
              public_repos: user.public_repos,
              followers:    user.followers,
              following:    user.following,
              repos: repos.map(r => ({
                name:             r.name,
                description:      r.description,
                html_url:         r.html_url,
                language:         r.language,
                stargazers_count: r.stargazers_count,
                forks_count:      r.forks_count,
                updated_at:       r.updated_at,
              })),
              updated_at: new Date().toISOString(),
            };

            fs.writeFileSync('data/profile.json', JSON.stringify(profile, null, 2));
            console.log('Profile data written to data/profile.json');

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/profile.json
          if git diff --staged --quiet; then
            echo "変更なし、スキップ"
          else
            git commit -m "chore: update profile data [skip ci]"
            git push
          fi
