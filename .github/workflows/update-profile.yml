name: Deploy Profile to GitHub Pages

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 UTC 0:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub profile data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'skizi';

            const { data: user } = await github.rest.users.getByUsername({ username });
            const { data: repos } = await github.rest.repos.listForUser({
              username,
              sort: 'updated',
              per_page: 6,
              type: 'public',
            });

            const profile = {
              login:        user.login,
              name:         user.name,
              bio:          user.bio,
              avatar_url:   user.avatar_url,
              location:     user.location,
              blog:         user.blog,
              html_url:     user.html_url,
              public_repos: user.public_repos,
              followers:    user.followers,
              following:    user.following,
              repos: repos.map(r => ({
                name:             r.name,
                description:      r.description,
                html_url:         r.html_url,
                language:         r.language,
                stargazers_count: r.stargazers_count,
                forks_count:      r.forks_count,
                updated_at:       r.updated_at,
              })),
              updated_at: new Date().toISOString(),
            };

            fs.writeFileSync('data/profile.json', JSON.stringify(profile, null, 2));
            console.log('Profile data written.');

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
