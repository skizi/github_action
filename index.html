<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .nav a:hover { color: var(--text); border-color: var(--border); }
    .nav a.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(88,166,255,0.08);
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* Profile */
    .profile {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      margin-bottom: 1.5rem;
      padding: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--border);
      flex-shrink: 0;
    }

    .profile-info { flex: 1; }
    .profile-name { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.2rem; }
    .profile-login { font-size: 1rem; color: var(--muted); margin-bottom: 0.75rem; }
    .profile-bio { margin-bottom: 0.75rem; line-height: 1.6; }
    .profile-meta { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; color: var(--muted); font-size: 0.875rem; }
    .profile-meta a { color: var(--accent); text-decoration: none; }

    /* Stats */
    .stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-card {
      flex: 1; min-width: 140px;
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
    }
    .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

    /* Repos */
    .section-title {
      font-size: 1.1rem; font-weight: 600;
      margin-bottom: 1rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .repos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .repo-card {
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; flex-direction: column; gap: 0.5rem;
      transition: border-color 0.2s;
    }
    .repo-card:hover { border-color: var(--accent); }
    .repo-name a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    .repo-desc { color: var(--muted); font-size: 0.85rem; line-height: 1.5; flex: 1; }
    .repo-footer { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; align-items: center; }
    .lang-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    /* Footer */
    .footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding-top: 1rem; border-top: 1px solid var(--border); }

    .loading { text-align: center; padding: 4rem; color: var(--muted); }
    .error   { text-align: center; padding: 2rem; color: #f85149; }

    @media (max-width: 580px) {
      .profile { flex-direction: column; align-items: center; text-align: center; }
      .profile-meta { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="index.html" class="active">プロフィール</a>
    <a href="prices.html">価格トラッカー</a>
  </nav>
  <div id="app" class="loading">読み込み中...</div>
</div>
<script>
  const LANG_COLORS = {
    JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5',
    Ruby:'#701516', Java:'#b07219', Go:'#00ADD8', Rust:'#dea584',
    'C++':'#f34b7d', C:'#555555', 'C#':'#178600', PHP:'#4F5D95',
    Swift:'#F05138', Kotlin:'#A97BFF', HTML:'#e34c26', CSS:'#563d7c',
    Shell:'#89e051', Vue:'#41b883', Dockerfile:'#384d54',
  };

  async function render() {
    const app = document.getElementById('app');
    try {
      const res = await fetch('data/profile.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const p = await res.json();

      const meta = [];
      if (p.location) meta.push(`📍 ${p.location}`);
      if (p.blog)     meta.push(`🔗 <a href="${p.blog}" target="_blank" rel="noopener">${p.blog}</a>`);
      if (p.html_url) meta.push(`<a href="${p.html_url}" target="_blank" rel="noopener">GitHub</a>`);

      const repoCards = (p.repos || []).map(r => {
        const color = LANG_COLORS[r.language] || '#8b949e';
        const lang  = r.language
          ? `<span><span class="lang-dot" style="background:${color}"></span>${r.language}</span>`
          : '';
        return `
          <div class="repo-card">
            <div class="repo-name"><a href="${r.html_url}" target="_blank" rel="noopener">${r.name}</a></div>
            <div class="repo-desc">${r.description || '<em>説明なし</em>'}</div>
            <div class="repo-footer">
              ${lang}
              <span>⭐ ${r.stargazers_count}</span>
              <span>🍴 ${r.forks_count}</span>
            </div>
          </div>`;
      }).join('');

      const updated = p.updated_at
        ? new Date(p.updated_at).toLocaleString('ja-JP')
        : '—';

      document.title = `${p.name || p.login} — GitHub Profile`;
      app.className = '';
      app.innerHTML = `
        <div class="profile">
          <img class="avatar" src="${p.avatar_url}" alt="${p.login}">
          <div class="profile-info">
            <div class="profile-name">${p.name || p.login}</div>
            <div class="profile-login">@${p.login}</div>
            ${p.bio ? `<div class="profile-bio">${p.bio}</div>` : ''}
            <div class="profile-meta">${meta.join('')}</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat-card"><div class="stat-value">${p.public_repos}</div><div class="stat-label">Repositories</div></div>
          <div class="stat-card"><div class="stat-value">${p.followers}</div><div class="stat-label">Followers</div></div>
          <div class="stat-card"><div class="stat-value">${p.following}</div><div class="stat-label">Following</div></div>
        </div>

        <div class="section-title">Recent Repositories</div>
        <div class="repos-grid">${repoCards || '<p style="color:var(--muted)">リポジトリなし</p>'}</div>

        <div class="footer">最終更新: ${updated} — GitHub Actions により自動更新</div>
      `;
    } catch (e) {
      app.innerHTML = `<div class="error">データ読み込みエラー: ${e.message}</div>`;
    }
  }

  render();
</script>
</body>
</html>
